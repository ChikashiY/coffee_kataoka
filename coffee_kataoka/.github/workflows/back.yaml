name: Back CI/CD

on:
  push:
    paths:
      - "02_back/**"
      - ".github/workflows/back.yml"
  pull_request:
    paths:
      - "02_back/**"
      - ".github/workflows/back.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02_back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02_back/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present